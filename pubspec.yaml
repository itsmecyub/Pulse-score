name: pulse_score
description: "PulseScore — Live Football Scores & Stats"
publish_to: 'none'
version: 1.1.6+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5
  shared_preferences: ^2.5.4
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  in_app_review: ^2.0.12
  google_mobile_ads: 9.0.0
  applovin_max: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# Regenerate the launcher icons with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  # The App Store rejects icons with an alpha channel.
  remove_alpha_ios: true
  # Android 8+ draws the icon inside its own mask; the artwork sits on the
  # dark ground the mark was designed against rather than a white edge.
  adaptive_icon_background: "#0B1120"
  adaptive_icon_foreground: assets/icon/app_icon.png

flutter:
  uses-material-design: true

  assets:
    - assets/weather.json
    - assets/icon/app_icon.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
