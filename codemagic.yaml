workflows:
  testFlight:
    name: LUKE
    integrations:
      app_store_connect: LUKE THOMPSON
    environment:
      flutter: stable
      ios_signing:
        # Let the App Store Connect integration fetch (or create) the
        # distribution certificate and profile for this exact bundle id.
        #
        # The manually uploaded "Pulsescore" profile was issued for a different
        # App ID, so `use-profiles` matched nothing against the Runner target,
        # left it on automatic signing, and the archive then looked for a
        # development profile that does not exist on the build machine.
        distribution_type: app_store
        bundle_identifier: com.pulsescore.pulseScore
    scripts:
      # Before use-profiles: the generated xcconfig has to exist first.
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - lukethompso66@icloud.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
