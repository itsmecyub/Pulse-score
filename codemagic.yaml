workflows:
  testFlight:
    name: LUKE
    integrations:
      app_store_connect: LUKE THOMPSON
    environment:
      flutter: stable
      ios_signing:
        # Must match PRODUCT_BUNDLE_IDENTIFIER in ios/Runner.xcodeproj, or
        # `xcode-project use-profiles` installs a profile the Runner target
        # never matches and the archive falls back to automatic signing.
        bundle_identifier: com.pulsescore.pulseScore
        provisioning_profiles:
          - Pulsescore
        certificates:
          - Certificate1
    scripts:
      # Before use-profiles: the generated xcconfig has to exist first.
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - lukethompso66@icloud.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
